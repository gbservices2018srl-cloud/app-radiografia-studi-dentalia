{% extends "base.html" %}
{% block title %}Dati aziendali{% endblock %}
{% block content %}
<h1>Dati aziendali</h1>
<p class="meta" style="margin:-8px 0 16px">Compaiono nell'intestazione e nel piè di pagina dei preventivi stampati.</p>
<form method="post">
  <section class="card">
    <div class="griglia">
      <label>Ragione sociale<input name="ragione_sociale" value="{{ imp.ragione_sociale or '' }}"></label>
      <label>Indirizzo<input name="indirizzo" value="{{ imp.indirizzo or '' }}"></label>
      <label>P. IVA<input name="piva" value="{{ imp.piva or '' }}"></label>
      <label>Telefono<input name="telefono" value="{{ imp.telefono or '' }}"></label>
      <label>Email<input type="email" name="email" value="{{ imp.email or '' }}"></label>
      <label>Sito web<input name="sito" value="{{ imp.sito or '' }}"></label>
      <label>IBAN<input name="iban" value="{{ imp.iban or '' }}"></label>
      <label>Validità predefinita (giorni)<input type="number" name="validita_default" min="1" value="{{ imp.validita_default or 30 }}"></label>
    </div>
    <label style="display:block;margin-top:12px">Condizioni predefinite<textarea name="condizioni_default" rows="4">{{ imp.condizioni_default or '' }}</textarea></label>
  </section>
  <button class="btn grande" type="submit">Salva</button>
</form>
{% endblock %}
