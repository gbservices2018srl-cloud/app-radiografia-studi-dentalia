{% extends "base.html" %}
{% block title %}Cambia password{% endblock %}
{% block content %}
<h1>Cambia password</h1>
<form method="post" class="card stretto">
  <label>Password attuale<input type="password" name="attuale" autocomplete="current-password" required></label>
  <label>Nuova password (min. 8 caratteri)<input type="password" name="nuova" minlength="8" autocomplete="new-password" required></label>
  <button class="btn grande" type="submit">Salva</button>
</form>
{% endblock %}
