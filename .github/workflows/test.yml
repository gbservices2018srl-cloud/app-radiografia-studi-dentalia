name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test con SQLite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee esito-sqlite.txt
      - name: Errori leggibili (SQLite)
        if: failure()
        run: |
          python - <<'PY'
          testo = open("esito-sqlite.txt", encoding="utf-8", errors="replace").read()
          blocchi = testo.split("=" * 70)[1:]
          for b in blocchi[:8]:
              print("::error::" + b.strip()[-1800:].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
      - name: Test con Postgres (come su Render)
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/test
        run: python -m unittest discover -s tests -v
