# Descrive la configurazione su Render (Francoforte). Il Blueprint è scollegato dal 26/10/2026:
# questo file è solo documentazione, Render non lo applica in automatico.
services:
  - type: web
    name: radiografia-studio-eu
    region: frankfurt
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL        # email del primo amministratore (la inserisci su Render)
        sync: false
      - key: ADMIN_PASSWORD     # password del primo amministratore (la inserisci su Render)
        sync: false
      - key: ADMIN_NOME
        value: Amministratore
      - key: DATABASE_URL
        fromDatabase:
          name: radiografia-db-eu
          property: connectionString

databases:
  - name: radiografia-db-eu
    region: frankfurt
    plan: basic-256mb
