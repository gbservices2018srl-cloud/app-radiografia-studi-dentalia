{% extends "base.html" %}
{% block title %}Accedi — Radiografia Studio{% endblock %}
{% block content %}
<div class="login-box">
  <div class="logo">RS</div>
  <h1>Radiografia Studio</h1>
  <p class="meta">Area riservata ai commerciali</p>
  <form method="post" class="card">
    <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn grande" type="submit">Accedi</button>
  </form>
  <p class="meta">Non hai ancora un account? <a href="{{ url_for('registrati') }}">Richiedi l'accesso</a></p>
</div>
{% endblock %}
