<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ n.oggetto }}</title></head>
<body style="margin:0;padding:0;background:#f6f5f2;font-family:Arial,Helvetica,sans-serif;color:#0f1f33">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f5f2">
  <tr><td align="center" style="padding:24px 12px">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e3e1dc">
      <tr><td align="center" style="background:#062039;padding:26px 24px 22px">
        <img src="{{ logo }}" width="150" alt="Dentalia" style="display:block;width:150px;max-width:60%;height:auto;background:#ffffff;border-radius:10px;padding:10px">
      </td></tr>
      <tr><td style="height:4px;background:#cca165;font-size:0;line-height:0">&nbsp;</td></tr>
      <tr><td style="padding:30px 32px 10px;font-size:16px;line-height:1.6">
        <h1 style="margin:0 0 18px;font-size:22px;line-height:1.3;color:#062039">{{ n.oggetto }}</h1>
        {{ corpo | safe }}
      </td></tr>
      <tr><td style="padding:6px 32px 30px">
        <a href="https://www.dentaliagroup.it" style="display:inline-block;background:#cca165;color:#062039;font-weight:bold;text-decoration:none;padding:12px 22px;border-radius:8px">Scopri Dentalia</a>
      </td></tr>
      <tr><td style="background:#f8f2e8;padding:18px 32px;font-size:12px;line-height:1.5;color:#5f6b7a">
        <strong style="color:#062039">{{ imp.ragione_sociale }}</strong>{% if imp.indirizzo %} · {{ imp.indirizzo }}{% endif %}{% if imp.piva %} · P.IVA {{ imp.piva }}{% endif %}<br>
        Ricevi questa email perché hai acconsentito a ricevere la newsletter Dentalia.<br>
        <a href="{{ link }}" style="color:#8f6a33">Non voglio più ricevere queste email</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
